name: CI/CD Security Pipeline
on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    needs: [secrets-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      - name: Run tests
        run: npm test --if-present
        working-directory: backend 

  sca:
    needs: [secrets-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      - name: npm audit
        run: npm audit --audit-level=high
        working-directory: backend
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
  sast:
    needs: [secrets-scan]
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: semgrep ci --config=auto
        env:
          SEMGREP_RULES: p/nodejs p/javascript p/owasp-top-ten

  container-scan:
    needs: [test, sast, sca]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t mailcatch-backend:${{ github.sha }} ./backend
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mailcatch-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
  
  
  dast:
    needs: [container-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mailcatch
          POSTGRES_USER: mailcatch
          POSTGRES_PASSWORD: mailcatch_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and start app
        run: |
          cd backend && npm ci
          node migrations/run.js
          node src/index.js &
          sleep 5
        env:
          DATABASE_URL: postgresql://mailcatch:mailcatch_secret@localhost:5432/mailcatch
          JWT_SECRET: test-secret-for-ci
          PORT: 3001
          SMTP_PORT: 2525
          MAIL_DOMAIN: mailcatch.dev
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost:3001
          cmd_options: -a